name: Tests

on:
  - push
  - pull_request

jobs:
  tests:
    env:
      ENV_NAME: tests
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    defaults:
     run:
       # Adding -l {0} ensures conda can be found properly in each step
       shell: bash -l {0}
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          # auto-update-conda: true
          channels: conda-forge,defaults
          python-version: ${{ matrix.python-version }}
          channel-priority: true

      # 21cmFAST is only distributed as an sdist, so its C dependencies must be
      # available to build it. Python dependencies are all handled by uv.
      - name: Install Non-Python Dependencies
        run: |
          conda install fftw gsl compilers pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the Package
        run: |
          uv sync --locked --all-extras --group tests --python "$CONDA_PREFIX/bin/python"

      - name: Run Tests
        run: |
          uv run --no-sync coverage run -m pytest

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && success()
        uses: codecov/codecov-action@v7
        with:
          files: "./coverage.xml"
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
