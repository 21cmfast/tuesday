[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/tuesday/_version.py"
parentdir_prefix_version = "tuesday-"
fallback_version  = "0.0.0"

[project]
name = "tuesday-eor"
description = "Tools for post-processing and computing summaries of 21cmFAST simulations"
readme = "README.rst"
authors = [
    { name = "Daniela Breitman", email = "daniela.breitman@sns.it" },
    { name = "James Davies", email = "james.davies@sns.it" },
    { name = "Steven Murray", email = "murray.steveng@gmail.com" },
]
requires-python = ">=3.11"
license = {text="MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
    "21cmsense>=3.0.0",
    "astropy>=6.0",
    "attrs>=25.3.0",
    "deprecation",
    "numpy>=2",
    "powerbox>=1.0.0",
    "scipy>=1.15.2",
]
dynamic = ['version']

[project.optional-dependencies]
21cmfast = [
    "21cmFAST>=4.1.0",
]
ska = [
    "ska-ost-array-config>=5",
]

[project.urls]
Repository = "https://github.com/21cmfast/tuesday"
Issues = "https://github.com/21cmfast/tuesday/issues"
Changelog = "https://github.com/21cmfast/tuesday/releases"

[dependency-groups]
tests = [
    "coverage>=7.8.2",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
docs = [
    "sphinx>=9.0.4",
    "tools21cm>=2.3.10",
]
dev = [
    "ipykernel>=7.2.0",
    "pip>=26.0.1",
    "pre-commit>=4.2.0",
    "prek>=0.4.4",
    {include-group = "tests"},
    {include-group = "docs"},
]


[tool.pytest.ini_options]
addopts = "--durations=25 --cov tuesday --cov-config=.coveragerc --cov-report xml:./coverage.xml "
norecursedirs = [
    "dist",
    "build",
]
testpaths = "tests"



[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "E",    # pycodestyle
  "W",    # pycodestyle warning
  "F",    # pyflakes
  "C90",  # mccabe complexity
  "I",    # isort
  "N",    # pep8-naming
  "D",    # docstyle
  # "ANN"   # type annotations
  "B",    # bugbear
  "A",    # builtins
  "C4",   # comprehensions
  "DTZ",  # datetime
  "FA",   # future annotations
  "PIE",  # flake8-pie
  "T",    # print statements
  "PT",   # pytest-style
  "Q",    # quotes
  "SIM",  # simplify
  "PTH",  # use Pathlib
  "ERA",  # kill commented code
  "NPY",  # numpy-specific rules
  "PERF", # performance
  # "FURB", # refurb
  "RUF",  # ruff-specific rules
  "RET",  # return statements
  "RSE",  # exception raises
  "TRY201", # verbose raise
]

ignore = [
    "D101",  # Missing docstring in public class -- my docstrings are in the __init__ which seems to fail this ?
]

[tool.ruff.lint.per-file-ignores]
"docs/tutorials/lc_noise_compare_tools21cm.ipynb" = [
    "T201", # print statements
    "N",
    "F",  # TODO: remove all these once this notebook is fixed.
]
"src/tuesday/__init__.py" = [
    "BLE001",  # deliberate broad except in version-detection fallback
]
"tests/*.py" = [
    "D",  # ignore missing docstring in tests
    "DTZ",   # ignore datetime in tests
    "T",     # print statements
]
"*.ipynb" = [
    "T201", # print statements
]
"docs/conf.py" = [
    "A",  # conf.py can shadow builtins
    "ERA",
    "DTZ",
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'
property-decorators = [
    "property",
    "functools.cached_property",
    "pytest.fixture"
]
[tool.ruff.lint.mccabe]
max-complexity = 21

[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"
